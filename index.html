<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>thynC™ 계약현황 대시보드 2026년 03월 기준</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface2: #f0f4f8;
    --border: #dde3ed;
    --accent: #1a6fd8;
    --accent2: #0d52a8;
    --gold: #c8860a;
    --green: #14a85a;
    --red: #d93251;
    --text: #1a2340;
    --text-muted: #6b7c99;
    --상급: #b07800;
    --종합: #1a6fd8;
    --병원: #0f9e52;
    --grade-A: #0f9e52;
    --grade-B: #1a6fd8;
    --grade-C: #c8860a;
    --grade-D: #d93251;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #ffffff 0%, #eef3fb 100%);
    border-bottom: 1px solid #dde3ed;
    padding: 20px 24px 16px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-inner { max-width: 1400px; margin: 0 auto; }
  .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(22px, 4vw, 32px);
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: none;
  }
  .logo span { color: var(--text-muted); font-size: 0.55em; letter-spacing: 1px; display: block; font-family: 'Noto Sans KR', sans-serif; font-weight: 300; margin-top: -4px; }
  .header-kpi { display: flex; gap: 20px; flex-wrap: wrap; }
  .kpi-chip {
    background: #eef3fb;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    color: #5a6a85;
  }
  .kpi-chip strong { color: var(--accent); font-size: 15px; display: block; }

  /* ── TAB NAV (상위 뎁스) ── */
  .tab-nav {
    max-width: 1400px; margin: 20px auto 0; padding: 0 24px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .tab-btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px; font-weight: 700;
    padding: 10px 22px;
    border: 1.5px solid var(--border);
    border-radius: 50px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 0.5px;
  }
  .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    box-shadow: 0 0 16px rgba(0,200,255,0.35);
  }
  .tab-btn.tab-overview.active { background: var(--gold); border-color: var(--gold); color: #fff; box-shadow: 0 0 8px rgba(200,134,10,0.2); }
  .tab-btn.tab-revenue.active  { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab-btn.tab-util.active    { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 0 8px rgba(14,168,90,0.2); }
  .tab-btn.tab-device.active  { background: #7c5cbf; border-color: #7c5cbf; color: #fff; box-shadow: 0 0 8px rgba(124,92,191,0.2); }

  /* ── FILTER BAR (종별 구분) ── */
  .filter-bar {
    max-width: 1400px; margin: 14px auto 0; padding: 0 24px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .filter-label { font-size: 11px; color: var(--text-muted); margin-right: 4px; }
  .filter-btn {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px; font-weight: 500;
    padding: 6px 16px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: #3a4a64; color: var(--text); }
  .filter-btn.active[data-filter="전체"] { background: #e8eef8; border-color: #aabbd6; color: var(--text); }
  .filter-btn.active[data-filter="상급"] { background: #fff8e6; border-color: var(--상급); color: var(--상급); }
  .filter-btn.active[data-filter="종합"] { background: #e6f1fb; border-color: var(--종합); color: var(--종합); }
  .filter-btn.active[data-filter="병원"] { background: #e6f8ee; border-color: var(--병원); color: var(--병원); }

  /* ── MAIN CONTENT ── */
  .main { max-width: 1400px; margin: 20px auto; padding: 0 24px 60px; }

  /* ── OVERVIEW PANEL ── */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .ov-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    position: relative; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .ov-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
  .ov-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 4px; height: 100%;
  }
  .ov-card.total::before { background: var(--accent); }
  .ov-card.sang::before  { background: var(--상급); }
  .ov-card.jong::before  { background: var(--종합); }
  .ov-card.byung::before { background: var(--병원); }
  .ov-card.local::before { background: #9ca3af; }
  .ov-label { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .ov-count { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .ov-count strong { font-size: 28px; font-weight: 900; color: var(--text); }
  .ov-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .ov-sub span { display: flex; justify-content: space-between; }
  .ov-sub em { color: var(--text); font-style: normal; font-weight: 500; }

  /* ── DONUT + BARS ── */
  .overview-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  @media (max-width: 700px) { .overview-charts { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
  }
  .chart-title { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 18px; text-transform: uppercase; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 12px; }
  .bar-label { width: 36px; color: var(--text-muted); text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
  .bar-val { width: 80px; text-align: right; color: var(--text); font-weight: 500; flex-shrink: 0; font-size: 11px; }
  svg.donut { display: block; margin: 0 auto 16px; }
  .donut-legend { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
  .donut-leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
  .donut-leg-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ── TABLE ── */
  .table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .table-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .table-count { font-size: 12px; color: var(--text-muted); }
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    padding: 12px 14px;
    text-align: left; white-space: nowrap;
    border-bottom: 1px solid #dde3ed;
    position: sticky; top: 0; z-index: 1;
  }
  thead th.right { text-align: right; }
  thead th.center { text-align: center; }
  tbody tr {
    border-bottom: 1px solid #eaeff6;
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f0f5fd; }
  tbody td { padding: 11px 14px; vertical-align: middle; }
  td.right { text-align: right; }
  td.center { text-align: center; }
  .rank-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px; color: var(--text-muted);
    width: 32px; text-align: center;
  }
  .rank-num.top3 { color: #c8860a; }
  .badge-종별 {
    display: inline-block;
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 4px;
    white-space: nowrap;
  }
  .badge-상급 { background: #fff3cc; color: var(--상급); border: 1px solid #e8c84a; }
  .badge-종합 { background: #deeeff; color: var(--종합); border: 1px solid #90bbee; }
  .badge-병원 { background: #d9f5e6; color: var(--병원); border: 1px solid #7acca0; }
  .hosp-name { font-weight: 500; color: var(--text); max-width: 200px; }
  .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
  .util-bar { display: flex; align-items: center; gap: 8px; }
  .util-track { flex: 1; min-width: 60px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .util-fill { height: 100%; border-radius: 3px; }
  .util-val { font-size: 12px; font-variant-numeric: tabular-nums; width: 40px; text-align: right; }
  .grade {
    font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
    display: inline-block;
  }
  .grade-A { color: var(--grade-A); background: #d9f5e6; }
  .grade-B { color: var(--grade-B); background: #deeeff; }
  .grade-C { color: var(--grade-C); background: #fff3cc; }
  .grade-D { color: var(--grade-D); background: #fde8ed; }

  /* ── SECTION ── */
  .section { display: none; }
  .section.active { display: block; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    .header { padding: 14px 16px 10px; }
    .tab-nav, .filter-bar, .main { padding-left: 16px; padding-right: 16px; }
    .header-kpi { display: none; }
    .kpi-chip { display: none; }
    tbody td, thead th { padding: 9px 10px; }
    table { font-size: 12px; }
    .hosp-name { max-width: 120px; }
    .overview-grid { grid-template-columns: 1fr 1fr; }
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim { animation: fadeUp 0.35s ease both; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #eef2f7; }
  ::-webkit-scrollbar-thumb { background: #c0cdd9; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">thynC<sup style="font-size:0.45em;vertical-align:super;letter-spacing:0">™</sup> <span>계약현황 대시보드 &nbsp;2026년 03월 기준</span></div>
      <div class="header-kpi" id="headerKpi"></div>

      <button class="tab-btn tab-util"    onclick="switchTab('util')">⚡ 가동율 순위</button>
      <button class="tab-btn tab-device"  onclick="switchTab('device')">🏥 병상수 순위</button>

  <button class="filter-btn" data-filter="종합" onclick="setFilter('종합')">종합병원</button>
  <button class="filter-btn" data-filter="병원" onclick="setFilter('병원')">병원</button>
</div>

<div class="main">
  <div class="section active" id="sec-overview"></div>
  <div class="section" id="sec-revenue"></div>
  <div class="section" id="sec-util"></div>
  <div class="section" id="sec-device"></div>
</div>

function renderHeaderKpi() {

// ── OVERVIEW ──
function getDevFiltered() {
  if (currentFilter === '전체') return DEV_DATA;
  return DEV_DATA.filter(d => d.종별 === currentFilter);
}

function renderOverview() {
  const devData = DEV_DATA;
  const ZONES = currentFilter === '전체' ? ['상급','종합','병원','로컬'] : [currentFilter];
  const OV_KEYS = currentFilter === '전체' ? ['전체','상급','종합','병원','로컬'] : [currentFilter];

  // Stats: hospital count + device sum per 종별
  const zoneStat = (z) => {
    const g = z === '전체' ? devData : devData.filter(d=>d.종별===z);
    return { count: g.length, devices: g.reduce((a,b)=>a+b.디바이스수,0) };
  };

  const clsMap = {전체:'total',상급:'sang',종합:'jong',병원:'byung',로컬:'local'};
  const cards = OV_KEYS.map(k => {
    const s = zoneStat(k);
    const cls = clsMap[k] || 'byung';
    return `<div class="ov-card ${cls}">
      <div class="ov-label">${k==='전체'?'전체 합계':k}</div>
      <div class="ov-count"><strong>${s.count}</strong> 개 병원</div>
      <div class="ov-sub">
        <span><span>총 병상수</span><em>${fmtNum(s.devices)} 병상</em></span>
      </div>
    </div>`;
  }).join('');

  // Device bar chart by 종별
  const totalDev = zoneStat('전체').devices || 1;
  const devBars = ZONES.map(k => {
    const val = zoneStat(k).devices;
    const pct = (val/totalDev*100).toFixed(1);
    const clr = k==='로컬'?'#9ca3af':`var(--${k})`;
    return `<div class="bar-row">
      <div class="bar-label">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${clr}"></div></div>
      <div class="bar-val">${fmtNum(val)} 병상 (${pct}%)</div>
    </div>`;
  }).join('');

  // Hospital count bar
  const totalHosp = zoneStat('전체').count || 1;
  const hospBars = ZONES.map(k => {
    const val = zoneStat(k).count;
    const pct = (val/totalHosp*100).toFixed(1);
    const clr = k==='로컬'?'#9ca3af':`var(--${k})`;
    return `<div class="bar-row">
      <div class="bar-label">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${clr}"></div></div>
      <div class="bar-val">${val}개 (${pct}%)</div>
    </div>`;
  }).join('');

  // 판매모델 breakdown from DEV_DATA rows — but we only have unique hosp data
  // Show top hospitals table snippet
  const filtered = getDevFiltered().slice().sort((a,b)=>b.디바이스수-a.디바이스수).slice(0,10);
  const topRows = filtered.map((d,i)=>`
    <tr>
      <td class="center"><div class="rank-num ${i<3?'top3':''}">${i+1}</div></td>
      <td class="center"><span class="badge-종별 badge-${d.종별}">${d.종별}</span></td>
      <td><div class="hosp-name">${d.병원명}</div></td>
      <td class="right">${fmtNum(d.디바이스수)}</td>
    </tr>`).join('');

  document.getElementById('sec-overview').innerHTML = `
    <div class="overview-grid anim">${cards}</div>
    <div class="overview-charts anim">
      <div class="chart-card">
        <div class="chart-title">🏥 종별 병상수 비중</div>
        ${devBars}
      </div>
      <div class="chart-card">
        <div class="chart-title">🏨 종별 병원 수 비중</div>
        ${hospBars}
      </div>
    </div>
    <div class="chart-card anim" style="margin-bottom:0">
      <div class="chart-title">🔝 병상수 상위 병원 (Top 10)</div>
      <div class="table-wrap" style="margin-top:12px">
        <table>
          <thead><tr><th class="center" style="width:44px">순위</th><th class="center">종별</th><th>병원명</th><th class="right">병상수</th></tr></thead>
          <tbody>${topRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

  const data = [...getFiltered()].sort((a,b) => b[sortKey] - a[sortKey]);
  const maxVal = data[0]?.[sortKey] || 1;

  const rows = data.map((d, i) => {
    const rank = i+1;
    const rankCls = rank <= 3 ? 'top3' : '';
    const utilPct = (d.평균가동율 * 100).toFixed(1);
    const gradeCls = `grade-${d.평가}`;
    const utilW = (d.평균가동율 / 1 * 100).toFixed(1);
    const barW = (d[sortKey] / maxVal * 100).toFixed(1);

    const cells = colDefs.map(col => {
      if (col.key === '_rank') return `<td class="center"><div class="rank-num ${rankCls}">${rank}</div></td>`;
      if (col.key === '종별') return `<td class="center"><span class="badge-종별 badge-${d.종별}">${d.종별}</span></td>`;
      if (col.key === '병원명') return `<td><div class="hosp-name">${d.병원명}</div></td>`;
      if (col.key === '월평균청구실제') return `<td class="right amount" style="color:${d.월평균청구실제===0?'var(--text-muted)':'var(--text)'}">${fmtAmtFull(d.월평균청구실제)}</td>`;
      if (col.key === '월평균청구실제_bar') return `<td><div class="util-bar"><div class="util-track"><div class="util-fill" style="width:${barW}%;background:var(--accent)"></div></div><div class="util-val" style="color:var(--accent)">${fmtAmt(d.월평균청구실제)}</div></div></td>`;
      if (col.key === '평균가동율') return `<td><div class="util-bar"><div class="util-track"><div class="util-fill" style="width:${utilW}%;background:${utilColor(d.평균가동율)}"></div></div><div class="util-val" style="color:${utilColor(d.평균가동율)}">${fmtPct(d.평균가동율)}</div></div></td>`;
      if (col.key === '디바이스수') return `<td class="right">${fmtNum(d.디바이스수)}</td>`;
      if (col.key === '디바이스수_bar') return `<td><div class="util-bar"><div class="util-track"><div class="util-fill" style="width:${barW}%;background:#a78bfa"></div></div><div class="util-val" style="color:#a78bfa">${fmtNum(d.디바이스수)}</div></div></td>`;
      if (col.key === '월평균순수익') return `<td class="right" style="color:var(--green)">${fmtAmt(d.월평균순수익)}</td>`;
      if (col.key === '평가') return `<td class="center"><span class="grade ${gradeCls}">${d.평가}</span></td>`;
      if (col.key === '예상회수기간') return `<td class="center" style="color:var(--text-muted);font-size:12px">${d.예상회수기간}</td>`;
      return `<td>${d[col.key]||'-'}</td>`;
    }).join('');

    return `<tr>${cells}</tr>`;
  }).join('');

  const ths = colDefs.map(c => `<th class="${c.align||''}">${c.label}</th>`).join('');

  document.getElementById(secId).innerHTML = `
    <div class="table-header anim">
      <div class="table-title">${title}</div>
      <div class="table-count">총 ${data.length}개 병원</div>
    </div>
    <div class="table-wrap anim">
      <table>
        <thead><tr>${ths}</tr></thead>
        <tbody>${rows || '<tr><td colspan="10" class="empty">데이터 없음</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function renderRevenue() {
  renderRankTable('sec-revenue', '월평균청구실제', '💰 월평균청구실제 기준 매출 순위', [
    {key:'_rank', label:'순위', align:'center'},
    {key:'종별', label:'종별', align:'center'},
    {key:'병원명', label:'병원명'},
    {key:'디바이스수', label:'디바이스수', align:'right'},
    {key:'월평균청구실제', label:'월평균청구실제', align:'right'},
    {key:'월평균순수익', label:'월평균순수익', align:'right'},
    {key:'평균가동율', label:'평균가동율'},
  ]);
}

function renderUtil() {
  renderRankTable('sec-util', '평균가동율', '⚡ 평균가동율 기준 순위', [
    {key:'_rank', label:'순위', align:'center'},
    {key:'종별', label:'종별', align:'center'},
    {key:'병원명', label:'병원명'},
    {key:'디바이스수', label:'디바이스수', align:'right'},
    {key:'평균가동율', label:'평균가동율'},
    {key:'월평균청구실제', label:'월평균청구실제', align:'right'},
    {key:'월평균순수익', label:'월평균순수익', align:'right'},
  ]);
}

function renderDevice() {
  const data = [...getDevFiltered()].sort((a,b) => b.디바이스수 - a.디바이스수);
  const maxVal = data[0]?.디바이스수 || 1;
  const rows = data.map((d,i) => {
    const rank = i+1;
    const barW = (d.디바이스수/maxVal*100).toFixed(1);
    return `<tr>
      <td class="center"><div class="rank-num ${rank<=3?'top3':''}">${rank}</div></td>
      <td class="center"><span class="badge-종별 badge-${d.종별}">${d.종별}</span></td>
      <td><div class="hosp-name">${d.병원명}</div></td>
      <td><div class="util-bar"><div class="util-track"><div class="util-fill" style="width:${barW}%;background:#7c5cbf"></div></div><div class="util-val" style="color:#7c5cbf;width:50px">${fmtNum(d.디바이스수)}</div></div></td>
    </tr>`;
  }).join('');
  document.getElementById('sec-device').innerHTML = `
    <div class="table-header anim">
      <div class="table-title">🏥 도입 병상수 기준 순위</div>
      <div class="table-count">총 ${data.length}개 병원</div>
    </div>
    <div class="table-wrap anim">
      <table>
        <thead><tr><th class="center" style="width:44px">순위</th><th class="center" style="width:80px">종별</th><th>병원명</th><th>도입 병상수</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="empty">데이터 없음</td></tr>'}</tbody>
      </table>
    </div>`;
}


let _utilVisible = false;
function toggleUtil() {
  _utilVisible = !_utilVisible;
  const val = document.getElementById('utilVal');
  const chip = document.getElementById('utilChip');
  const icon = document.getElementById('utilIcon');
  if (!val) return;
  val.style.filter = _utilVisible ? 'blur(0px)' : 'blur(6px)';
  chip.style.borderStyle = _utilVisible ? 'solid' : 'dashed';
  chip.title = _utilVisible ? '클릭하여 숨기기' : '클릭하여 확인';
  if (icon) icon.textContent = _utilVisible ? '👁' : '🔒';
}

function renderAll() {
  if (currentTab === 'overview') renderOverview();
  else if (currentTab === 'revenue') renderRevenue();
  else if (currentTab === 'util') renderUtil();
  else if (currentTab === 'device') renderDevice();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-${tab}`).classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
  renderAll();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderAll();
}

// init
renderHeaderKpi();
renderOverview();
</script>
</body>
</html>
